apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads-staging
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: git@github.com:cmontisci/oci-gitops.git
        revision: main
        directories:
          - path: workloads/*/overlays/staging
  template:
    metadata:
      name: "stg-{{index .path.segments 1}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: git@github.com:cmontisci/oci-gitops.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: apps-staging
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datastores-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:cmontisci/oci-gitops.git
    targetRevision: main
    path: datastores/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

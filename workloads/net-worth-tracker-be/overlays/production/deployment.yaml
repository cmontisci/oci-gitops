apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-worth-tracker-be
spec:
  replicas: 1
  selector:
    matchLabels:
      app: net-worth-tracker-be
  template:
    metadata:
      labels:
        app: net-worth-tracker-be
    spec:
      imagePullSecrets:
        - name: ghcr
      initContainers:
        - name: migrate
          image: ghcr.io/cmontisci/net-worth-tracker-be:781fbf2a414b27eb60da5745241fe5d33c54e3b3
          command:
            - php
            - bin/console
            - doctrine:migrations:migrate
            - --no-interaction
            - --allow-no-migration
          envFrom:
            - secretRef:
                name: nwt-config
          volumeMounts:
            - name: jwt
              mountPath: /app/config/jwt
              readOnly: true
      containers:
        - name: net-worth-tracker-be
          image: ghcr.io/cmontisci/net-worth-tracker-be:781fbf2a414b27eb60da5745241fe5d33c54e3b3
          ports:
            - name: fpm
              containerPort: 9000
          envFrom:
            - secretRef:
                name: nwt-config
          volumeMounts:
            - name: jwt
              mountPath: /app/config/jwt
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: jwt
          secret:
            secretName: nwt-jwt
        - name: nginx-config
          configMap:
            name: net-worth-tracker-be-nginx

apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-worth-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: net-worth-tracker
  template:
    metadata:
      labels:
        app: net-worth-tracker
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: net-worth-tracker
          image: ghcr.io/cmontisci/net-worth-tracker-fe:edc5b154d3572ecf0e44aae5083436af61208b27
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
